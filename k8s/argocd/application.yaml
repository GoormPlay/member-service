apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: member-service
spec:
  project: default
  source:
    repoURL: https://github.com/GoormPlay/member-service.git
    targetRevision: deploy
    path: helm
  destination:
    server: https://kubernetes.default.svc
    namespace: member
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
