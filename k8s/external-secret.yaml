apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: member-service-secret
  namespace: member
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: member-service-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: member-service-secret
